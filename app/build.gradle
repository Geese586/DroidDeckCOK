plugins {
    id 'com.android.application'
}
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Machine-specific tooling and optional CI-prepared inputs stay out of version control.
def localBuildOptions = new Properties()
def localBuildOptionsFile = rootProject.layout.projectDirectory.file('local.properties')
if (localBuildOptionsFile.asFile.exists()) {
    localBuildOptions.load(new StringReader(providers.fileContents(localBuildOptionsFile).asText.get()))
}
def pythonExecutable = project.findProperty('pythonExecutable')
    ?: localBuildOptions.getProperty('droiddeck.python', 'python3')
def vitureSdkDir = project.hasProperty('vitureSdkDir') ? project.property('vitureSdkDir') : localBuildOptions.getProperty('droiddeck.vitureSdk', '')
def uvcDir = project.hasProperty('uvcDir') ? project.property('uvcDir') : localBuildOptions.getProperty('droiddeck.uvcDir', '')
if (uvcDir) {
    ['arm64-v8a/libusb.so', 'arm64-v8a/libuvc.a', 'include/libusb.h', 'include/libuvc/libuvc.h',
     'licenses/libusb-COPYING', 'licenses/libuvc-LICENSE.txt'].each { required ->
        if (!new File(uvcDir, required).isFile()) throw new GradleException("Incomplete UVC build: missing ${required}")
    }
}
if (vitureSdkDir) {
    ['android/arm64-v8a/libglasses.so', 'android/arm64-v8a/libcarina_vio.so',
     'android/arm64-v8a/libcloud_protocol.so', 'include/viture_glasses_provider.h',
     'android/LICENSE', 'android/NOTICE'].each { required ->
        if (!new File(vitureSdkDir, required).isFile()) {
            throw new GradleException("Incomplete VITURE Android SDK: missing ${required}")
        }
    }
}

def gitValue = { List<String> arguments ->
    try {
        def output = providers.exec {
            commandLine(['git'] + arguments)
            workingDir rootProject.projectDir
            ignoreExitValue = true
        }
        output.result.get().exitValue == 0 ? output.standardOutput.asText.get().trim() : null
    } catch (Exception ignored) {
        null
    }
}

def buildLabel = providers.environmentVariable('DROIDDECK_BUILD_LABEL').getOrNull()
if (buildLabel == null || buildLabel.trim().isEmpty()) {
    def eventName = providers.environmentVariable('GITHUB_EVENT_NAME').getOrNull()
    def eventPath = providers.environmentVariable('GITHUB_EVENT_PATH').getOrNull()
    if (eventName == 'pull_request_target' && eventPath) {
        try {
            def eventFile = layout.file(providers.provider { new File(eventPath) })
            def eventText = providers.fileContents(eventFile).asText.get()
            def pullRequest = new groovy.json.JsonSlurper().parseText(eventText).pull_request
            if (pullRequest?.number && pullRequest?.head?.sha) {
                buildLabel = "pr${pullRequest.number} at ${pullRequest.head.sha.take(7)}"
            }
        } catch (Exception ignored) {
        }
    }
    if (buildLabel == null || buildLabel.trim().isEmpty()) {
        def branch = providers.environmentVariable('GITHUB_REF_NAME').getOrNull()
            ?: gitValue(['branch', '--show-current']) ?: 'local'
        def commit = providers.environmentVariable('GITHUB_SHA').getOrNull()
            ?.take(7) ?: gitValue(['rev-parse', '--short=7', 'HEAD']) ?: 'unknown'
        buildLabel = "${branch} at ${commit}"
    }
}
def buildOrigin = providers.environmentVariable('GITHUB_ACTIONS').getOrNull() == 'true' ? 'remote' : 'local'
def treeState = providers.environmentVariable('DROIDDECK_BUILD_TREE_STATE').getOrNull()
if (!(treeState in ['clean', 'dirty'])) {
    def status = gitValue(['status', '--porcelain'])
    treeState = status == null ? 'unknown' : (status.isEmpty() ? 'clean' : 'dirty')
}
buildLabel = "${buildOrigin} ${treeState} · ${buildLabel}"
def escapedBuildLabel = buildLabel.replace('\\', '\\\\').replace('"', '\\"')

def sourceCommit = providers.environmentVariable('DROIDDECK_SOURCE_COMMIT').getOrNull()
    ?: providers.environmentVariable('GITHUB_SHA').getOrNull() ?: gitValue(['rev-parse', 'HEAD']) ?: ''
def prNumber = (providers.environmentVariable('DROIDDECK_PR_NUMBER').getOrNull() ?: '0').with { it.isInteger() ? it : '0' }
def ciBuild = providers.environmentVariable('GITHUB_ACTIONS').getOrNull() == 'true'
def releaseSigner = rootProject.file('keystore/release-signer.sha256').text.trim()
def commitTime = (gitValue(['show', '-s', '--format=%ct', 'HEAD']) ?: '0').with { it.isLong() ? it : '0' }
def desktopKde = rootProject.file('tools/desktop-kde/release.env').readLines()
    .findAll { it.contains('=') && !it.startsWith('#') }
    .collectEntries { def kv = it.split('=', 2); [(kv[0].trim()): kv[1].trim()] }
def desktopRemovalSources = new groovy.json.JsonSlurper().parse(file('src/main/assets/desktop-removal/sources.json'))
if (desktopRemovalSources.archives[desktopKde.DESKTOP_KDE_TAG] != desktopKde.DESKTOP_KDE_SHA256) {
    throw new GradleException('Desktop removal inventories do not match the pinned archive')
}
if (!file('src/main/assets/desktop-removal/versions.txt').readLines().contains(desktopKde.DESKTOP_KDE_TAG)) {
    throw new GradleException('Regenerate desktop removal inventories for ' + desktopKde.DESKTOP_KDE_TAG)
}
def variantSuffixes = rootProject.file('tools/release/variants.txt').readLines()
    .findAll { it.trim() && !it.startsWith('#') }
    .collect { def f = it.trim().split(/\s+/); "${f[1]}=${f[2] == '-' ? '' : f[2]}" }
    .join(';')

android {
    namespace 'com.droiddeck.launcher'
    compileSdk 34
    ndkVersion project.findProperty('ndkVersion') ?: '27.3.13750724'

    defaultConfig {
        applicationId "com.droiddeck.launcher"
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 14
        // The upstream release this copy carries, without its leading "0.": upstream 0.5.0 is
        // "5.0" here. It is deliberately kept comparable with upstream's own numbering, because
        // this is the number Android's app info screen shows and the one anything else that reads
        // a package version will see. A fork-only sequence cannot live here: "5.0.1" against an
        // official "0.5.1" is ahead on its second component, so the update page would read every
        // release DroidDeck makes as older than this build (see ui/UpdatesForkPage.kt).
        versionName "5.0"
        // This fork's own label: the upstream release above plus a fork-only fourth component, so
        // "0.5.0.2" reads as "COK(0.5.0.2)" in the settings dialog and as "(COK0.5.0.2)" beside the
        // official version on the updates page. Kept out of the line above on purpose - a fourth
        // component can never collide with an upstream tag, and the packaging script names the APK
        // in dist/ after the line above, not after this.
        //
        // LEFT ALONE BY THE FORK'S OWN WORK. The number is the publisher's, not the author's: it is
        // bumped when a release is cut, by whoever cuts it, and never as a side effect of a change.
        // Bumping it here makes two different builds claim the same version or puts a number in
        // front of users that no release was ever published under.
        buildConfigField "String", "FORK_VERSION", "\"0.4.0.6\""
        buildConfigField "String", "BUILD_LABEL", "\"${escapedBuildLabel}\""
        buildConfigField "String", "SOURCE_COMMIT", "\"${sourceCommit}\""
        buildConfigField "int", "PR_NUMBER", "${prNumber}"
        buildConfigField "boolean", "CI_BUILD", "${ciBuild}"
        buildConfigField "String", "RELEASE_SIGNER", "\"${releaseSigner}\""
        buildConfigField "long", "COMMIT_TIME", "${commitTime}L * 1000L"
        buildConfigField "String", "VARIANT_SUFFIXES", "\"${variantSuffixes}\""
        buildConfigField "String", "SGDB_API_KEY", "\"${System.getenv("SGDB_API_KEY") ?: project.findProperty("sgdbApiKey") ?: ""}\""
        buildConfigField "String", "DESKTOP_KDE_TAG", "\"${desktopKde.DESKTOP_KDE_TAG}\""
        buildConfigField "String", "DESKTOP_KDE_URL", "\"https://github.com/${desktopKde.DESKTOP_KDE_REPO}/releases/download/${desktopKde.DESKTOP_KDE_TAG}/desktop-kde.tar.zst\""
        buildConfigField "String", "DESKTOP_KDE_SHA256", "\"${desktopKde.DESKTOP_KDE_SHA256}\""
        buildConfigField "long", "DESKTOP_KDE_SIZE", "${desktopKde.DESKTOP_KDE_SIZE}L"

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                arguments "-DDROIDDECK_VITURE_SDK_DIR=${vitureSdkDir.toString().replace('\\', '/')}"
                arguments "-DDROIDDECK_UVC_DIR=${uvcDir.toString().replace('\\', '/')}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        testkey {
            storeFile file("${rootDir}/keystore/testkey.p12")
            storeType "PKCS12"
            storePassword "android"
            keyAlias "testkey"
            keyPassword "android"
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.testkey
            def localSuffix = localBuildOptions.getProperty('droiddeck.debugApplicationIdSuffix')
            if (localSuffix) {
                applicationIdSuffix localSuffix
                resValue 'string', 'app_name', 'DroidDeck XR Dev'
            }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.testkey
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['**/libtermux.so']
        }
    }

    buildFeatures {
        prefab true
        compose true
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all {
            def logTarget = providers.systemProperty('robolectric.logging').orNull
            if (logTarget != null) systemProperty 'robolectric.logging', logTarget
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// Vendor binaries remain in the user's SDK directory; never vendor them into Git.
if (vitureSdkDir) {
    android.sourceSets.main.jniLibs.srcDir(new File(vitureSdkDir, 'android'))
    def stageVitureNotices = tasks.register('stageVitureNotices', Copy) {
        from(new File(vitureSdkDir, 'android')) { include 'LICENSE', 'NOTICE' }
        into(layout.buildDirectory.dir('vitureAssets/licenses/viture'))
    }
    tasks.named('preBuild').configure { dependsOn(stageVitureNotices) }
}

def stageSessionScripts = tasks.register('stageSessionScripts', Copy) {
    from(rootProject.file('tools/linuxfs/overlay')) {
        include 'usr/local/bin/droiddeck-*', 'usr/local/bin/steam-compatibility', 'usr/bin/**'
    }
    into(layout.projectDirectory.dir('src/main/assets/linuxfs'))
}
tasks.named('preBuild').configure { dependsOn(stageSessionScripts) }

def runtimeAssetsDir = layout.buildDirectory.dir('runtimeAssets')
def stageRuntimeAssets = tasks.register('stageRuntimeAssets', Sync) {
    dependsOn(stageSessionScripts)
    from(layout.projectDirectory.dir('src/main/assets')) { exclude 'pulseaudio.tzst' }
    // Upstream's tools/build_local.sh writes the turnip sets into build/prepared-assets, so both
    // sides of this Sync can carry them and Gradle refuses the duplicate. This fork has no
    // build_local.sh: "prepared" here means the release APK's own copies, laid down beside every
    // other payload in src/main/assets. That copy is the one to keep, so the prepared side stands
    // down for these four names. (DroidDeckCOK)
    from(layout.buildDirectory.dir('prepared-assets')) {
        exclude 'graphics_driver/adrenotools-turnip25.1.0-quest1.tzst'
        exclude 'graphics_driver/adrenotools-turnip26.3.0-a6xx.tzst'
        exclude 'graphics_driver/adrenotools-turnip26.3.0-quest2.tzst'
    }
    into(runtimeAssetsDir)
}
android.sourceSets.main.assets.setSrcDirs([runtimeAssetsDir])
if (vitureSdkDir) android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('vitureAssets'))
if (uvcDir) {
    def stageUvcNotices = tasks.register('stageUvcNotices', Copy) {
        from(new File(uvcDir, 'licenses'))
        into(layout.buildDirectory.dir('uvcAssets/licenses/uvc'))
    }
    tasks.named('preBuild').configure { dependsOn(stageUvcNotices) }
    android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('uvcAssets'))
}
tasks.named('preBuild').configure { dependsOn(stageRuntimeAssets) }

// Unit tests and previews remain usable without Docker. Packaging an APK requires the complete
// runtime payload prepared by the local helper or CI, with matching sources and output hashes.
//
// The check itself needs an interpreter, and asking for one is the fragile part of this task:
//   * the bare name "python3" is a trap on Windows - the App Execution Alias of that name is a
//     Store stub whose run exits 9009 with no message, which is how bumping the version string
//     came to abort a build that had nothing wrong with it;
//   * launching a probe to find a working name is a process at *configuration* time, and when
//     the stub is the one that answers, the caught exception still leaves Gradle a failed value
//     source to serialize: the build then dies a second time with "configuration cache
//     problems", so one broken alias could kill a build twice over.
// So none of that happens at configuration time. The names below are looked up along PATH as
// plain files (the Store alias directory is skipped), ordered so the stub is asked last, and no
// process runs until the task does. On Windows "python" is the name a real install answers to;
// "python3" there is usually either absent or the stub.
def runtimeInputsPython = {
    def windows = System.getProperty('os.name').toLowerCase().contains('windows')
    def names = windows ? ['python.exe', 'py.exe', 'python3.exe'] : ['python3', 'python']
    def dirs = (System.getenv('PATH') ?: '').split(File.pathSeparator)
    for (name in names) {
        for (dir in dirs) {
            def at = (dir ?: '').replace('"', '').trim()
            if (!at || at.toLowerCase().contains('windowsapps')) continue
            def candidate = new File(at, name)
            if (candidate.isFile()) return candidate.absolutePath
        }
    }
    return windows ? 'python.exe' : 'python3'
}()

def verifyRuntimeInputs = tasks.register('verifyRuntimeInputs', Exec) {
    mustRunAfter(stageSessionScripts, stageRuntimeAssets)
    workingDir rootProject.projectDir
    description = 'Checks the prepared runtime payload against tools/release/runtime_inputs.py record.'
    commandLine runtimeInputsPython, 'tools/release/runtime_inputs.py', 'verify'
}
tasks.configureEach { task ->
    if (task.name in ['packageDebug', 'packageRelease']) task.dependsOn(verifyRuntimeInputs)
}

// The GOG / Epic / Amazon download engines are Rust (app/src/main/rust/stores, ported from
// Bannerlator's bl-steam-client crate). cargo-ndk cross-compiles them for arm64-v8a into the build
// directory, which is one more jniLibs source below: nothing compiled is committed, the same rule
// the preloads, proot and the DirectAudio relay follow. cargo-ndk exports the NDK clang/llvm-ar as
// the C compiler for the one C-compiling crate (ring, under rustls) - the step Bannerlator's CI
// does by hand - and reads the NDK from ANDROID_NDK_HOME, which is set to the NDK this build pins.
// -PskipRust=true builds without the library, for a checkout with no Rust toolchain: the stores
// then report themselves unavailable instead of the build failing. This fork ships the engine as
// a prebuilt in jniLibs (see below) and so is never in that state.
def rustCrateDir = layout.projectDirectory.dir('src/main/rust/stores')
def rustJniLibsDir = layout.buildDirectory.dir('rustJniLibs')
// A prebuilt engine sitting in jniLibs - taken out of the release APK, which is where every other
// compiled payload of this fork comes from - is as good as building it: this fork's rust/ tree is
// upstream's, verbatim. When one is there the cross-compile is skipped, so a build machine needs
// no Rust toolchain at all, and it must be skipped rather than merely unused: rustJniLibs would
// otherwise hold a second copy of libdroiddeckstores.so and the native-lib merge would fail on it.
def prebuiltRustLib = file('src/main/jniLibs/arm64-v8a/libdroiddeckstores.so')
def skipRust = (project.findProperty('skipRust')
    ?: localBuildOptions.getProperty('droiddeck.skipRust', 'false')).toString().toBoolean() ||
    prebuiltRustLib.exists()
def buildRustStores = tasks.register('buildRustStores', Exec) {
    description = 'Cross-compiles the store download engines (libdroiddeckstores.so) with cargo-ndk.'
    onlyIf { !skipRust }
    inputs.dir(rustCrateDir.dir('src'))
    inputs.files(rustCrateDir.file('Cargo.toml'), rustCrateDir.file('Cargo.lock'))
    inputs.property('ndkVersion', android.ndkVersion)
    if (!skipRust) inputs.property('rustToolchain', providers.exec {
        environment 'PATH', "${System.getProperty('user.home')}/.cargo/bin${File.pathSeparator}${System.getenv('PATH')}"
        commandLine 'rustup', 'run', 'stable', 'rustc', '-Vv'
    }.standardOutput.asText)
    outputs.dir(rustJniLibsDir)
    workingDir rustCrateDir
    def cargoBin = "${System.getProperty('user.home')}/.cargo/bin"
    environment 'PATH', "${cargoBin}${File.pathSeparator}${System.getenv('PATH')}"
    environment 'ANDROID_NDK_HOME', android.ndkDirectory.absolutePath
    environment 'CARGO_TERM_COLOR', 'never'
    if (!skipRust) environment 'RUSTC', providers.exec {
        commandLine 'rustup', 'which', '--toolchain', 'stable', 'rustc'
    }.standardOutput.asText.get().trim()
    commandLine 'rustup', 'run', 'stable', 'cargo', 'ndk', '--target', 'arm64-v8a', '--platform', '26',
        '--output-dir', rustJniLibsDir.get().asFile.absolutePath,
        'build', '--release', '--locked'
}
if (!skipRust) android.sourceSets.main.jniLibs.srcDir(rustJniLibsDir)
tasks.named('preBuild').configure { dependsOn(buildRustStores) }

def verifyHandModel = tasks.register('verifyHandModel') {
    def models = ['hand_landmarker.task': 'fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1',
                  'hand_landmarker_lite.task': '173c0f47ecee7e935bd4a1e93aa580756b4180c1307c07d709313e82c28672c8']
        .collectEntries { name, hash -> [(file("src/main/assets/models/$name")): hash] }
    inputs.files(models.keySet())
    doLast {
        models.each { model, expected ->
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(model.bytes).encodeHex().toString()
            if (actual != expected) throw new GradleException("Hand Landmarker model checksum mismatch: ${model.name}")
        }
    }
}
tasks.named('preBuild').configure { dependsOn(verifyHandModel) }


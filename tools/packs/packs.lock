{
  "_comment": [
    "DroidDeckCOK: every add-on pack this build knows about, pinned by content.",
    "bundled=true  -> the archive lives in app/src/main/assets/packs and AddonPack unpacks it",
    "                 straight out of the APK, so the first one-click install needs no network.",
    "bundled=false -> the archive is NOT in the APK; AddonPack downloads it from",
    "                 Droid-Deck/DroidDeck-Components at tag pack-<name>-<sha256[:16]> and",
    "                 verifies the digest below. Losing the entry here would leave",
    "                 BuildConfig.PACK_<NAME>_SHA256 empty, which makes AddonPack.available",
    "                 false and the feature unable to install at all - silently.",
    "app/build.gradle asserts both directions (bundled but missing, unbundled but present).",
    "Refreshing for a new upstream: list releases of Droid-Deck/DroidDeck-Components, take",
    "pack-<name>-<sha16> tags, and confirm sha256sum of the downloaded archive starts with",
    "the same 16 characters."
  ],
